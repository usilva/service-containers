networks:
  db-network:
    external: false

services:
    postgres:
        container_name: postgresSQL
        image: postgres:17.9-alpine3.23
        restart: always
        environment:
            - POSTGRES_USER=${PGSQL_USER}
            - POSTGRES_PASSWORD=${PGSQL_PASSWORD}
        networks:
            - db-network
        ports:
            - '35432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data:rw
            
